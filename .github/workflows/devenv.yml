# devenv CI (DEP-060, DEV-001). Runs `devenv test` on a GitHub runner: the Postgres, web and worker
# processes and enterTest (ADR-0066). Runs on pull requests that touch devenv.* or this file, and nightly.
# Secrets are headless (ADR-0135): the test profile's values come from its committed fake defaults and
# the committed fixture key, never from the keyring.
name: devenv

on:
  pull_request:
    paths:
      - "devenv.*"
      - ".github/workflows/devenv.yml"
  schedule:
    # Nightly, 03:23 UTC. Runs only from the default branch (GitHub schedule rule).
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: devenv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: devenv test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # initdb refuses to run as root (DEV-010). The hosted runner user is not root; fail early if that changes.
      - name: Require a non-root user
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "devenv test must not run as root: initdb refuses root" >&2
            exit 1
          fi

      # Nix builds that miss the cache ran out of disk on a hosted runner (run 37777214419). Free the
      # preinstalled toolchains this job does not use first (defence in depth; see ADR-0136).
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # The substituter and key are copied from the tagged flake's nixConfig (raw.githubusercontent.com
          # cachix/devenv v2.4.0 flake.nix), so the daemon trusts the devenv cache for every user (ADR-0136).
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      # The CLI is pinned to the v2.4.0 tag (the version ADR-0066 verified with). --accept-flake-config
      # applies the tagged flake's own nixConfig too.
      - name: Install devenv
        run: |
          nix profile install --accept-flake-config github:cachix/devenv/v2.4.0
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Check the devenv version
        run: |
          set -euo pipefail
          version="$(devenv version)"
          case "$version" in
            "devenv 2.4.0 "*|"devenv 2.4.0+"*) echo "$version" ;;
            *) echo "unexpected devenv version: $version (expected 2.4.0)" >&2; exit 1 ;;
          esac

      # Headless secrets (ADR-0135). The keyring provider has no store on a runner. A global provider
      # overrides every per-secret route, but a secret's `ref` still renames its lookup, so the env
      # provider would look for the fixture file name. The `file` provider over the committed fixture
      # directory resolves the key through that `ref`, and the test profile's fake defaults fill the rest.
      # Nothing is exported to the job environment and no value is printed.
      - name: Check the test profile resolves
        run: devenv shell --no-tui --secretspec-provider file:./testing/fixtures --secretspec-profile test secretspec check --provider file:./testing/fixtures --profile test --no-prompt

      # The job-level timeout did not stop a hung step (run 113332239938), so this step has its own bound (ADR-0137).
      # The flags override devenv.yaml's keyring provider for this command only (DEV-010, ADR-0135).
      - name: Run devenv test
        timeout-minutes: 30
        run: devenv test --no-tui --secretspec-provider file:./testing/fixtures --secretspec-profile test

      # Only fake values exist in this job. Prints whatever devenv wrote for the processes.
      - name: Print devenv process logs on failure
        if: failure()
        run: |
          find .devenv -name '*.log' -print0 2>/dev/null | xargs -0 -r tail -n 200 || true
