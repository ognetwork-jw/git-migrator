{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when the Ingress is enabled" .Values.ingress.host }}
{{- $web := dict "root" . "component" "web" }}
{{- /* DEP-032: Server-Sent Events need buffering off and long timeouts. */}}
{{- $annotations := dict
      "nginx.ingress.kubernetes.io/proxy-buffering" "off"
      "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600"
      "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600"
      "nginx.ingress.kubernetes.io/proxy-body-size" "5m" }}
{{- if .Values.ingress.clusterIssuer }}
{{- $_ := set $annotations "cert-manager.io/cluster-issuer" .Values.ingress.clusterIssuer }}
{{- end }}
{{- $annotations = mustMergeOverwrite $annotations (deepCopy .Values.ingress.annotations) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "git-migrator.fullname" . }}
  labels:
    {{- include "git-migrator.labels" $web | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ default (printf "%s-tls" (include "git-migrator.fullname" .)) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "git-migrator.fullname" . }}-web
                port:
                  name: http
{{- end }}
