{{- if .Values.serviceAccount.create }}
{{- /* Hook copy for the migrate Job; the federated credential trusts both subjects (docs/deployment.md). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "git-migrator.migrateServiceAccountName" . }}
  labels:
    {{- include "git-migrator.labels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- if .Values.azure.workloadIdentityClientId }}
    azure.workload.identity/client-id: {{ .Values.azure.workloadIdentityClientId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "git-migrator.serviceAccountName" . }}
  labels:
    {{- include "git-migrator.labels" (dict "root" . "component" "serviceaccount") | nindent 4 }}
  {{- if or .Values.azure.workloadIdentityClientId .Values.serviceAccount.annotations }}
  annotations:
    {{- if .Values.azure.workloadIdentityClientId }}
    azure.workload.identity/client-id: {{ .Values.azure.workloadIdentityClientId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
