# Own secretspec provider, no Ingress, no ServiceAccount creation, no metrics (DEP-033).
image:
  repository: example/git-migrator
secretspec:
  provider: "akv://kv-other?auth=workload_identity"
postgres:
  host: pg.internal
serviceAccount:
  create: false
  name: existing-sa
ingress:
  enabled: false
metrics:
  enabled: false
config:
  auth:
    entra:
      tenantId: 11111111-2222-3333-4444-555555555555
  publicUrl: https://git-migrator.internal.example
