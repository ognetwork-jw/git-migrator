# secretspec manifest (DEV-030). Verified against secretspec 0.21.1 (ADR-0065).
#
# Profiles:
# - default: the declarations (descriptions and requiredness) every profile inherits.
# - development: developer defaults (keyring or dotenv, the developer's choice; see docs/README.md).
# - test: standalone (inherit = false), repeats every development default explicitly, fake values only.
# - e2e: live e2e against real Bitbucket and GitHub test accounts; no defaults (docs/e2e-setup.md).
#
# The GitHub App key comes from the committed throwaway fixture through the `file` provider
# (ADR-0065): the manifest never embeds key material.

[project]
name = "git-migrator"
revision = "1.0"

[providers]
fixtures = "file:./testing/fixtures"
test_env = "dotenv:.env.test"

[profiles.default]
POSTGRES_PASSWORD      = { description = "Password for the git_migrator Postgres role", required = true }
BETTER_AUTH_SECRET     = { description = "Better Auth signing secret (≥32 random bytes, base64)", required = true }
ENTRA_CLIENT_ID        = { description = "Entra app registration client id", required = true }
ENTRA_CLIENT_SECRET    = { description = "Entra app registration client secret", required = true }
BITBUCKET_CREDENTIALS  = { description = "JSON array: [{id, accountId, email, apiToken}] for the Bitbucket endpoint", required = true }
GITHUB_APP_PRIVATE_KEY = { description = "PEM private key of the GitHub App", required = true }
ATLASSIAN_ADMIN_API_KEY = { description = "Atlassian Admin API key for email enrichment (optional)", required = false }
GM_TEST_USER_PASSWORD  = { description = "Password for seeded test actors (test sign-in only)", required = false }

[profiles.development]
POSTGRES_PASSWORD     = { default = "git_migrator" }
BETTER_AUTH_SECRET    = { default = "dev-only-insecure-secret-change-me-0000000000" }
ENTRA_CLIENT_ID       = { default = "dev-unused" }
ENTRA_CLIENT_SECRET   = { default = "dev-unused" }
BITBUCKET_CREDENTIALS = { default = "[{\"id\":\"fake\",\"accountId\":\"fake-user\",\"email\":\"fake@test.local\",\"apiToken\":\"fake\"}]" }
GITHUB_APP_PRIVATE_KEY = { providers = ["fixtures"], ref = { item = "fake-github-app.pem" } }
GM_TEST_USER_PASSWORD = { default = "test-password" }

# Profiles do not inherit in practice: inherit = false makes test standalone, so every
# development default is repeated here. Values come from .env.test first (dotenv), then the defaults.
[profiles.test.defaults]
inherit = false
providers = ["test_env"]

[profiles.test]
POSTGRES_PASSWORD      = { description = "Password for the git_migrator Postgres role", default = "git_migrator" }
BETTER_AUTH_SECRET     = { description = "Better Auth signing secret (≥32 random bytes, base64)", default = "dev-only-insecure-secret-change-me-0000000000" }
ENTRA_CLIENT_ID        = { description = "Entra app registration client id", default = "dev-unused" }
ENTRA_CLIENT_SECRET    = { description = "Entra app registration client secret", default = "dev-unused" }
BITBUCKET_CREDENTIALS  = { description = "JSON array: [{id, accountId, email, apiToken}] for the Bitbucket endpoint", default = "[{\"id\":\"fake\",\"accountId\":\"fake-user\",\"email\":\"fake@test.local\",\"apiToken\":\"fake\"}]" }
GITHUB_APP_PRIVATE_KEY = { description = "PEM private key of the GitHub App", providers = ["fixtures"], ref = { item = "fake-github-app.pem" } }
GM_TEST_USER_PASSWORD  = { description = "Password for seeded test actors (test sign-in only)", default = "test-password" }
ATLASSIAN_ADMIN_API_KEY = { description = "Atlassian Admin API key for email enrichment (optional)", required = false }

[profiles.e2e]
# live e2e against real Bitbucket/GitHub test accounts — no defaults; see docs/e2e-setup.md
