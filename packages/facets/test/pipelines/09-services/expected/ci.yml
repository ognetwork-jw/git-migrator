# Generated by git-migrator from bitbucket-pipelines.yml (pipelines.default). Review it before merging.
name: Default
on:
  push:
    branches:
      - "**"
  pull_request: {}
permissions:
  contents: read
jobs:
  step-1:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: app
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
      cache:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Script
        run: make integration
