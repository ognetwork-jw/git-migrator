# Generated by git-migrator from bitbucket-pipelines.yml (pipelines.default). Review it before merging.
name: Default
on:
  push:
    branches:
      - "**"
  pull_request: {}
permissions:
  contents: read
jobs:
  step-1:
    name: Public image
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Script
        run: node --version
  step-2:
    name: Private registry
    runs-on: ubuntu-latest
    needs:
      - step-1
    container:
      image: registry.example.test/team/builder:2.1
      credentials:
        username: ${{ vars.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Script
        run: build-tool run
