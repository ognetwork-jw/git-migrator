# Generated by git-migrator from bitbucket-pipelines.yml (pipelines.default). Review it before merging.
name: Default
on:
  push:
    branches:
      - "**"
  pull_request: {}
permissions:
  contents: read
jobs:
  step-1:
    name: Info
    runs-on: ubuntu-latest
    environment: staging
    env:
      BITBUCKET_BRANCH: ${{ github.head_ref || github.ref_name }}
      BITBUCKET_COMMIT: ${{ github.sha }}
      BITBUCKET_BUILD_NUMBER: ${{ github.run_number }}
      BITBUCKET_REPO_SLUG: ${{ github.event.repository.name }}
      BITBUCKET_CLONE_DIR: ${{ github.workspace }}
      BITBUCKET_PR_ID: ${{ github.event.pull_request.number }}
      BITBUCKET_PR_DESTINATION_BRANCH: ${{ github.base_ref }}
      BITBUCKET_DEPLOYMENT_ENVIRONMENT: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Script
        run: |-
          echo "$BITBUCKET_BRANCH $BITBUCKET_COMMIT"
          echo "build $BITBUCKET_BUILD_NUMBER of $BITBUCKET_REPO_SLUG in ${BITBUCKET_CLONE_DIR}"
          echo "PR $BITBUCKET_PR_ID into $BITBUCKET_PR_DESTINATION_BRANCH"
          echo "env $BITBUCKET_DEPLOYMENT_ENVIRONMENT"
