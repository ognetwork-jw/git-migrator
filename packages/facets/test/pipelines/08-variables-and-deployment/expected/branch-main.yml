# Generated by git-migrator from bitbucket-pipelines.yml (pipelines.branches.main). Review it before merging.
name: Branch main
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  step-1:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      TOKEN: ${{ secrets.TOKEN }}
      API_URL: ${{ vars.API_URL }}
      REGION: ${{ vars.REGION }}
      token: ${{ secrets.TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Script
        run: |-
          curl -H "Authorization: $TOKEN" "$API_URL/deploy?region=${REGION}"
          echo "$token" | wc -c
          echo "//registry//:_authToken=$NPM_TOKEN" > .npmrc
          echo "$HOME is not a managed variable"
