definitions:
  steps:
    - step: &build
        name: Build
        script:
          - make build
    - step: &defaults
        max-time: 10
        clone:
          depth: 1
pipelines:
  default:
    - step: *build
    - step:
        <<: *defaults
        name: Test
        script:
          - make test
  branches:
    main:
      - step: *build
